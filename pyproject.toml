[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "onnax"
version = "0.0.1.dev0"
description = "Experimental batching and automatic differentiation for ONNX graphs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "numpy>=1.26",
    "onnx>=1.23.2",
    "onnx-ir>=0.2.1",
    "onnx-shape-inference>=0.4.0",
    "typing-extensions>=4.10",
]

[dependency-groups]
dev = ["pytest>=8", "onnxruntime>=1.29", "ruff>=0.11", "mypy>=1.15", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
onnax = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = ["src"]
check_untyped_defs = true
show_error_codes = true
disable_error_code = ["import-untyped"]
