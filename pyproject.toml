[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "onnax"
version = "0.0.1.dev0"
description = "Experimental batching and automatic differentiation for ONNX graphs"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "onnx>=1.23.2",
    "onnx-ir>=1.1.0",
    "onnx-shape-inference>=0.4.0",
]

[project.urls]
Source = "https://github.com/justinchuby/onnax"
Issues = "https://github.com/justinchuby/onnax/issues"
Documentation = "https://github.com/justinchuby/onnax/blob/main/src/onnax/_functional.py"
Examples = "https://github.com/justinchuby/onnax/tree/main/examples"

[dependency-groups]
dev = [
    "pytest>=8",
    "onnxruntime>=1.31.1",
    "ruff>=0.11",
    "mypy>=1.15",
    "build>=1.2",
    "twine>=6.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
onnax = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = ["src"]
check_untyped_defs = true
show_error_codes = true
disable_error_code = ["import-untyped"]
