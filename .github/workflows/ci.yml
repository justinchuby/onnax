name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev --group training --group authoring
      - run: uv run --no-sync pytest
      - run: uv pip install -r examples/jelly/requirements-export.txt
      - run: uv run --no-sync python -m pytest examples/jelly/tests/test_models.py
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv build
      - run: uv run --no-sync twine check --strict dist/*
      - name: Exercise installed wheel and sdist outside the checkout
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/onnax-smoke"
          python="$RUNNER_TEMP/onnax-smoke/bin/python"
          cp tools/check_distribution.py "$RUNNER_TEMP/check_distribution.py"
          cp examples/custom_rules.py "$RUNNER_TEMP/custom_rules.py"
          for artifact in "$GITHUB_WORKSPACE"/dist/*.whl "$GITHUB_WORKSPACE"/dist/*.tar.gz; do
            uv pip install --python "$python" --reinstall "$artifact"
            uv pip check --python "$python"
            (cd "$RUNNER_TEMP" && "$python" -I check_distribution.py)
            (cd "$RUNNER_TEMP" && "$python" -I custom_rules.py)
          done

  jelly-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/jelly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: examples/jelly/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  huggingface:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --group dev --group training --group huggingface
      - run: uv run --no-sync pytest -q tests/test_fused_autodiff.py tests/test_segmented_session.py tests/test_huggingface_bridge.py tests/test_qwen_sft.py tests/test_decoder_checkpointing.py tests/test_torch_context.py tests/test_qwen_adapters.py tests/test_qwen_nf4.py tests/test_qwen_bf16.py tests/test_qwen_rms_audit.py tests/test_qwen_local_vjp.py tests/test_training_impact.py tests/test_quality_corpus.py tests/test_reference_head.py tests/test_saved_residuals.py tests/test_mlx_validation_report.py tests/test_runtime_factory.py tests/test_reference_losses.py tests/test_joint_loss.py
